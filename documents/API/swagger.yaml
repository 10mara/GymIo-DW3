  /api/planos:

    get:

      tags:
        - Planos

      summary: Listar planos

      description: |
        Retorna todos os planos cadastrados no sistema.

      responses:

        "200":

          description: Lista de planos.

          content:

            application/json:

              schema:

                type: array

                items:
                  $ref: "#/components/schemas/Plano"

        "500":
          $ref: "#/components/responses/InternalServerError"

    post:

      tags:
        - Planos

      summary: Criar plano

      description: |
        Cadastra um novo plano de academia.

      requestBody:

        required: true

        content:

          application/json:

            schema:
              $ref: "#/components/schemas/PlanoRequest"

      responses:

        "201":

          description: Plano criado com sucesso.

          content:

            application/json:

              schema:
                $ref: "#/components/schemas/Plano"

        "400":

          description: Campos obrigatórios ausentes.

          content:

            application/json:

              schema:
                $ref: "#/components/schemas/Error"

              example:

                erro: Campos obrigatórios ausentes

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/planos/{id}:

    put:

      tags:
        - Planos

      summary: Atualizar plano

      description: |
        Atualiza as informações de um plano existente.

      parameters:

        - name: id

          in: path

          required: true

          schema:

            type: integer

          example: 3

      requestBody:

        required: true

        content:

          application/json:

            schema:
              $ref: "#/components/schemas/PlanoRequest"

      responses:

        "200":

          description: Plano atualizado.

          content:

            application/json:

              schema:
                $ref: "#/components/schemas/Plano"

        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:

      tags:
        - Planos

      summary: Remover plano

      description: |
        Remove um plano do sistema.

      parameters:

        - name: id

          in: path

          required: true

          schema:

            type: integer

          example: 3

      responses:

        "200":

          description: Plano removido.

          content:

            application/json:

              schema:

                type: object

                properties:

                  mensagem:

                    type: string

                    example: Plano removido

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/planos/matriculas:

    get:

      tags:
        - Matrículas

      summary: Listar matrículas

      description: |
        Retorna todas as matrículas cadastradas.

      responses:

        "200":

          description: Lista de matrículas.

          content:

            application/json:

              schema:

                type: array

                items:
                  $ref: "#/components/schemas/Matricula"

        "500":
          $ref: "#/components/responses/InternalServerError"

    post:

      tags:
        - Matrículas

      summary: Criar matrícula

      description: |
        Associa um aluno a um plano.

        Antes da criação é realizada uma verificação para impedir
        que um aluno possua mais de uma matrícula ativa.

      requestBody:

        required: true

        content:

          application/json:

            schema:
              $ref: "#/components/schemas/MatriculaRequest"

      responses:

        "201":

          description: Matrícula criada.

          content:

            application/json:

              schema:
                $ref: "#/components/schemas/Matricula"

        "400":

          description: Aluno já possui matrícula ativa.

          content:

            application/json:

              schema:
                $ref: "#/components/schemas/Error"

              example:

                erro: Aluno já possui matrícula ativa

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/planos/matriculas/{id}/cancelar:

    patch:

      tags:
        - Matrículas

      summary: Cancelar matrícula

