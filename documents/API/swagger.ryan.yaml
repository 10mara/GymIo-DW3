# ============================================================
# Trecho do Swagger - módulos do Ryan (Auth, Pessoas, Funcionários)
# Mesclar em documents/API/swagger.yaml (seção "paths:" e "components/schemas:").
# ATENÇÃO: o swagger.yaml atual repete /api/auth/register, /login, /logout e /me
# (linhas ~379 e ~633). Apague as duplicatas ao mesclar.
# Segurança: CookieAuth já existe em components/securitySchemes.
# ============================================================
paths:
  /api/auth/register:
    post:
      tags: [Autenticação]
      summary: Cadastra um funcionário (pessoa + funcionário, em transação)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201": { description: Cadastro realizado }
        "400": { description: Validação (campos, senhas diferentes, cargo inexistente, CPF/e-mail já usados) }

  /api/auth/login:
    post:
      tags: [Autenticação]
      summary: Login. Define o cookie httpOnly com o JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Login realizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem: { type: string }
                  user: { $ref: "#/components/schemas/SessionUser" }
        "401": { description: Email ou senha inválidos (ou funcionário inativo) }

  /api/auth/logout:
    post:
      tags: [Autenticação]
      summary: Encerra a sessão (remove o cookie)
      security: []
      responses:
        "200": { description: Logout realizado }

  /api/auth/me:
    get:
      tags: [Autenticação]
      summary: Usuário da sessão atual
      responses:
        "200":
          description: Sessão válida
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/SessionUser" }
        "401": { description: Não autenticado / sessão inválida }

  /api/pessoas:
    get:
      tags: [Pessoas]
      summary: Lista pessoas (não excluídas) com dados de aluno, plano e funcionário
      responses:
        "200":
          description: Lista de pessoas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PessoaListItem" }
    post:
      tags: [Pessoas]
      summary: Cria pessoa como aluno e/ou funcionário (atômico)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PessoaCreate" }
      responses:
        "201": { description: Pessoa criada }
        "400": { description: Validação }
        "409": { description: CPF ou e-mail já cadastrados }

  /api/pessoas/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Pessoas]
      summary: Busca uma pessoa
      responses:
        "200":
          description: Pessoa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PessoaListItem" }
        "404": { description: Não encontrada }
    put:
      tags: [Pessoas]
      summary: Atualiza pessoa, aluno e assinatura mais recente (campos opcionais)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PessoaUpdate" }
      responses:
        "200": { description: Atualizada }
        "404": { description: Não encontrada }
        "409": { description: CPF ou e-mail já cadastrados }
    delete:
      tags: [Pessoas]
      summary: Exclusão lógica da pessoa (e de seus registros de aluno/funcionário)
      responses:
        "200": { description: Excluída }
        "404": { description: Não encontrada }

  /api/pessoas/total-alunos:
    get:
      tags: [Pessoas]
      summary: Total de alunos ativos
      responses:
        "200": { description: "{ total: number }" }
  /api/pessoas/indicadores:
    get:
      tags: [Pessoas]
      summary: Novos alunos no mês, cancelamentos e crescimento (%)
      responses:
        "200": { description: "{ novosMes, cancelamentos, crescimento }" }
  /api/pessoas/planos:
    get:
      tags: [Pessoas]
      summary: Planos ativos (apoio ao formulário de pessoas)
      responses:
        "200": { description: Lista de planos }
  /api/pessoas/cargos:
    get:
      tags: [Pessoas]
      summary: Cargos ativos (apoio ao formulário de pessoas)
      responses:
        "200": { description: Lista de cargos }

  /api/funcionarios:
    get:
      tags: [Funcionários]
      summary: Lista funcionários ativos (com pessoa e cargo)
      responses:
        "200": { description: Lista de funcionários }
        "401": { description: Não autenticado }
    post:
      tags: [Funcionários]
      summary: Cria funcionário para uma pessoa existente
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FuncionarioCreate" }
      responses:
        "201": { description: Criado }
        "400": { description: Pessoa/cargo inválidos }
        "409": { description: Pessoa já possui funcionário }

  /api/funcionarios/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Funcionários]
      summary: Busca funcionário
      responses:
        "200": { description: Funcionário }
        "404": { description: Não encontrado }
    put:
      tags: [Funcionários]
      summary: Atualiza cargo_id, data_admissao, ctps ou status (pessoa_id não pode mudar)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FuncionarioUpdate" }
      responses:
        "200": { description: Atualizado }
        "404": { description: Não encontrado }
    delete:
      tags: [Funcionários]
      summary: Exclusão lógica (status passa a Inativo)
      responses:
        "200": { description: Excluído }
        "404": { description: Não encontrado }

components:
  schemas:
    RegisterRequest:
      type: object
      required: [nome, email, telefone, cargo, senha, confirmar, cpf]
      properties:
        nome: { type: string }
        email: { type: string, format: email }
        telefone: { type: string }
        cargo: { type: string, description: Nome de um cargo existente }
        senha: { type: string, minLength: 6 }
        confirmar: { type: string }
        cpf: { type: string }
    LoginRequest:
      type: object
      required: [email, senha]
      properties:
        email: { type: string, format: email }
        senha: { type: string }
    SessionUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        email: { type: string }
        telefone: { type: string }
        cargo: { type: string }
        status: { type: string, example: Ativo }
        funcionario:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              status: { type: string }
    PessoaListItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        cpf: { type: string }
        telefone: { type: string }
        email: { type: string }
        dataNascimento: { type: string, format: date, nullable: true }
        endereco: { type: string, nullable: true }
        isAluno: { type: boolean }
        aluno_id: { type: string, nullable: true }
        matricula: { type: string }
        plano: { type: string }
        plano_id: { type: string }
        status: { type: string }
        isFuncionario: { type: boolean }
        cargo_id: { type: string }
        data_admissao: { type: string }
        senha: { type: string, description: Sempre mascarada }
    PessoaCreate:
      type: object
      required: [nome, cpf, telefone, email]
      properties:
        nome: { type: string }
        cpf: { type: string }
        telefone: { type: string }
        email: { type: string }
        dataNascimento: { type: string, format: date }
        endereco: { type: string }
        senha: { type: string, description: Gravada com hash bcrypt }
        isAluno: { type: boolean }
        isFuncionario: { type: boolean }
        plano_id: { type: string, format: uuid }
        cargo_id: { type: string, format: uuid }
        status: { type: string }
        data_matricula: { type: string, format: date }
        data_admissao: { type: string, format: date }
    PessoaUpdate:
      type: object
      properties:
        nome: { type: string }
        cpf: { type: string }
        telefone: { type: string }
        email: { type: string }
        dataNascimento: { type: string, format: date }
        endereco: { type: string }
        senha: { type: string, description: "Só altera se enviada e não vazia" }
        status: { type: string, enum: [Ativo, Inadimplente, Cancelado] }
        dataMatricula: { type: string, format: date }
        plano_id: { type: string, format: uuid, nullable: true }
    FuncionarioCreate:
      type: object
      required: [pessoa_id, cargo_id]
      properties:
        pessoa_id: { type: string, format: uuid }
        cargo_id: { type: string, format: uuid }
        data_admissao: { type: string, format: date }
        ctps: { type: string, maxLength: 20 }
        status: { type: string }
    FuncionarioUpdate:
      type: object
      properties:
        cargo_id: { type: string, format: uuid }
        data_admissao: { type: string, format: date }
        ctps: { type: string, maxLength: 20 }
        status: { type: string }
